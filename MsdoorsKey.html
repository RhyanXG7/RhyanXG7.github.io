<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Generator</title>
    <style>
        /* Estilo Geral */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1E1E2E, #6D5DF5);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Container Principal */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 400px;
            animation: fadeIn 1s ease;
        }

        /* Títulos e Parágrafos */
        h1 {
            font-weight: 600;
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #FFD700;
        }

        p {
            font-size: 1rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* Botão Estilizado */
        button {
            font-size: 1rem;
            font-weight: 600;
            background: #6D5DF5;
            border: none;
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #5647DF;
            transform: scale(1.05);
        }

        /* Seção da Chave Gerada */
        #key-section {
            margin-top: 20px;
            display: none;
        }

        #key-display {
            font-size: 1.2rem;
            font-weight: bold;
            color: #00FF7F;
            margin-top: 10px;
        }

        /* Animação */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 Generate Your Key</h1>
        <p>Enter your Roblox User ID to generate a unique key for your account.</p>
        <button id="generate-key">Generate Key</button>
        <div id="key-section">
            <p>Your Generated Key:</p>
            <h2 id="key-display"></h2>
        </div>
    </div>

    <script>
        document.getElementById("generate-key").addEventListener("click", () => {
            const userId = prompt("Enter your Roblox User ID:");
            if (!userId) {
                alert("You must provide your User ID!");
                return;
            }

            // URL do Google Apps Script
            const url = `https://script.google.com/macros/s/AKfycbyOpu0kSoKVWSqDOHJleGjmjYwy-zryS1UqfTMqix7d9QSDKoFWccTcpJ2_Bj1Eu2FQAA/exec?userId=${userId}`;

            fetch(url)
                .then(response => response.text())
                .then(key => {
                    const keySection = document.getElementById("key-section");
                    const keyDisplay = document.getElementById("key-display");

                    keySection.style.display = "block";
                    keyDisplay.textContent = key;
                })
                .catch(err => {
                    alert("Error fetching key: " + err);
                });
        });
    </script>
</body>
</html>
